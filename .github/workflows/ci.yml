name: tests

on:
  push:
  pull_request:

# The two environments the release was tested in (requirements.txt), on the CPU build of PyTorch. The tests do not
# need the dataset.
jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            torch: "2.12.0"
          - python-version: "3.10"
            torch: "2.9.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Style (pycodestyle and pyflakes rules)
        run: |
          python -m pip install ruff==0.16.10
          python -m ruff check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Command line
        run: python -m pebrnet --help
